# Fly.io: servidor de juego en una máquina siempre encendida, con HTTPS en <app>.fly.dev.
#   fly launch --no-deploy --copy-config      (desde la raíz del proyecto; elige un nombre de app)
#   fly volumes create mystery_data --size 1 --region cdg
#   fly secrets set AUTH_SECRET="$(openssl rand -base64 48)" CLIENT_ORIGIN="https://<tu-cliente>.pages.dev"
#   fly deploy
# Los secretos van con `fly secrets`, nunca en este archivo.
app = "CAMBIA-ESTE-NOMBRE"
primary_region = "cdg"   # París (Madrid «mad» está retirada por Fly.io)
kill_signal = "SIGTERM"
kill_timeout = "30s"          # tiempo para guardar las expediciones en curso al desplegar

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "2567"
  TRUST_PROXY = "1"
  PROFILE_STORE = "sqlite"     # base de datos en el volumen (o "postgres" + secreto DATABASE_URL)
  DATA_DIR = "/data"
  RECONNECT_SECONDS = "45"
  LOG_LEVEL = "info"

[[mounts]]
  source = "mystery_data"
  destination = "/data"

[http_service]
  internal_port = 2567
  force_https = true
  # Las salas viven en la memoria de la máquina: no se debe apagar sola ni repartir entre varias
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
